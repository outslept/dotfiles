[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "None"
startup_mode = "Maximized"
opacity = 0.95
blur = false
decorations_theme_variant = "None"
resize_increments = false
level = "Normal"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "CommitMono Nerd Font", style = "Regular" }
bold = { family = "CommitMono Nerd Font", style = "Bold" }
italic = { family = "CommitMono Nerd Font", style = "Italic" }
bold_italic = { family = "CommitMono Nerd Font", style = "Bold Italic" }
size = 11.0
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 1 }
builtin_box_drawing = true

[colors.primary]
background = "#1e1e1e"
foreground = "#d4d4d4"

[colors.cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"

[colors.search.matches]
foreground = "#181818"
background = "#ac4242"

[colors.search.focused_match]
foreground = "#181818"
background = "#f4bf75"

[colors.hints.start]
foreground = "#181818"
background = "#f4bf75"

[colors.hints.end]
foreground = "#181818"
background = "#ac4242"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#181818"
background = "#d8d8d8"

[colors.selection]
text = "CellBackground"
background = "CellForeground"

[colors.normal]
black = "#1e1e1e"
red = "#f44747"
green = "#608b4e"
yellow = "#dcdcaa"
blue = "#569cd6"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#d4d4d4"

[colors.bright]
black = "#545454"
red = "#f44747"
green = "#608b4e"
yellow = "#dcdcaa"
blue = "#569cd6"
magenta = "#c678dd"
cyan = "#56b6c2"
white = "#d4d4d4"

[colors]
draw_bold_text_with_bright_colors = true
transparent_background_colors = false

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"
command = "None"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = false

[cursor]
style = { shape = "Block", blinking = "On" }
vi_mode_style = "None"
blink_interval = 750
blink_timeout = 5
unfocused_hollow = true
thickness = 0.15

[terminal]
osc52 = "OnlyCopy"
shell = { program = "pwsh", args = ["-NoLogo"] }

[mouse]
hide_when_typing = true
bindings = [
    { mouse = "Middle", action = "PasteSelection" }
]

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[[:alnum:]\\-\\._~:/?#\\[\\]@!$&'\\(\\)\\*\\+,;=]*"
hyperlinks = true
command = { program = "cmd", args = ["/c", "start", ""] }
post_processing = true
mouse = { enabled = true }
binding = { key = "U", mods = "Control|Shift" }

[keyboard]
bindings = [
    { key = "V", mods = "Control", action = "Paste" },
    { key = "C", mods = "Control", action = "Copy" },
    { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
    { key = "W", mods = "Control|Shift", action = "Quit" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },
    { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "F11", action = "ToggleFullscreen" },
    { key = "PageUp", mods = "Control", action = "ScrollPageUp" },
    { key = "PageDown", mods = "Control", action = "ScrollPageDown" },
    { key = "Home", mods = "Control", action = "ScrollToTop" },
    { key = "End", mods = "Control", action = "ScrollToBottom" },
    { key = "L", mods = "Control", action = "ClearHistory" },
    { key = "Space", mods = "Control", action = "ToggleViMode" },
    { key = "Space", mods = "Control|Shift", action = "ToggleLineSelection" },
    { key = "Escape", mode = "Vi", action = "ToggleViMode" },
    { key = "Y", mode = "Vi", action = "Copy" },
    { key = "V", mode = "Vi", action = "ToggleNormalSelection" }
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "glsl3"
print_events = false
highlight_damage = false
prefer_egl = false

[general]
live_config_reload = true
working_directory = "None"
