[alias]
	st = status
	s = status -s
	br = branch
	cm = commit
	co = checkout
	cob = switch -c
	re = restore
	rs = restore --staged
	sw = switch
	pick = cherry-pick
	undo = reset --soft HEAD~1
	amend = commit --amend
	nuke = reset --hard
	purge = clean -fd
	undo-first = update-ref -d HEAD
	trim = "!f() { git fetch -p && git for-each-ref --format='%(refname:short)' refs/heads/ | grep -Ev '^(main|master|develop)$' | xargs -r git branch -d; }; f"
	lg = log --graph --pretty=format:\"%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset\" --abbrev-commit
	last = log -1 HEAD --stat
	ls = log --oneline
	sl = log --graph --pretty=format:'commit: %C(bold red)%h%Creset %C(red)<%H>%Creset %C(bold magenta)%d %Creset%ndate: %C(bold yellow)%cd %Creset%C(yellow)%cr%Creset%nauthor: %C(bold blue)%an%Creset %C(blue)<%ae>%Creset%n%C(cyan)%s%n%Creset'
	me = "!git sl --author=\"$(git config user.name)\""
	logcm = log -1 --pretty=format:'commit: %C(bold red)%h%Creset %C(red)<%H>%Creset %C(bold magenta)%d %Creset%ndate: %C(bold yellow)%cd %Creset%C(yellow)%cr%Creset%nauthor: %C(bold blue)%an%Creset %C(blue)<%ae>%Creset%n%n%C(bold cyan)%s%n%n%C(cyan)%b%n%Creset'
	authors = shortlog -e -s -n
	aliases = config --get-regexp ^alias\\.
	find = "!f() { git ls-files | grep -i \"$1\"; }; f"
	today = "!git log --since=midnight --author=\"$(git config user.name)\" --oneline"
	standup = "!git log --since=yesterday --author=\"$(git config user.name)\" --pretty=format:\"%Cred%h%Creset - %s\""
